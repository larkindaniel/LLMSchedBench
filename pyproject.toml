[build-system]
requires = [
  "scikit-build-core>=0.10,<1",
  "pybind11>=2.13,<3",
]
build-backend = "scikit_build_core.build"

[project]
name = "llmschedbench"
version = "0.1.0.dev0"
description = "Multi-tenant LLM request-routing benchmark"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pyarrow>=17,<22",
  "pydantic>=2.8,<3",
  "PyYAML>=6,<7",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "hypothesis>=6.100,<7",
  "pybind11>=2.13,<3",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.6,<1",
]

[project.scripts]
llmschedbench = "llmschedbench.cli:main"

[tool.scikit-build]
cmake.version = ">=3.24"
cmake.build-type = "Release"
wheel.packages = ["python/llmschedbench"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests/python"]

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["third_party"]
